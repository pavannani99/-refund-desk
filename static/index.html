<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Refund Desk</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-grid.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-theme-quartz.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="logo">↺</span>
    <div>
      <h1>Refund Desk</h1>
      <p>AI drafts every refund decision. A person approves. PayPal pays.</p>
    </div>
  </div>
  <div class="modes" id="modes"></div>
</header>

<section class="kpis" id="kpis"></section>

<section class="charts">
  <div class="card"><h2>Requests by reason</h2><canvas id="chartIntent"></canvas></div>
  <div class="card"><h2>Where the money went</h2><canvas id="chartMoney"></canvas></div>
</section>

<section class="card gridcard">
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search buyer, item, message…">
    <div class="segmented" id="views">
      <button data-view="todo" class="on">To review</button>
      <button data-view="all">All</button>
      <button data-view="done">Done</button>
    </div>
    <span class="spacer"></span>
    <button id="btnNew" class="ghost">+ New message</button>
    <button id="btnRerun" class="ghost">Re-run AI</button>
    <button id="btnCsv" class="ghost">Export CSV</button>
    <button id="btnReset" class="ghost">Reset demo</button>
    <button id="btnDecline" class="danger">Decline</button>
    <button id="btnApprove" class="primary">Approve selected</button>
  </div>
  <div id="grid" class="ag-theme-quartz"></div>
  <p class="hint">Click a row to read the message, the AI's reasoning and its tool calls. Double-click <b>Action</b>, <b>Amount</b> or <b>Reply</b> to edit before approving.</p>
</section>

<aside id="drawer" class="drawer" hidden>
  <button class="close" id="drawerClose" aria-label="Close">×</button>
  <div id="drawerBody"></div>
</aside>

<dialog id="newDialog">
  <form method="dialog" id="newForm">
    <h2>Simulate a buyer message</h2>
    <label>Order <select id="newOrder"></select></label>
    <label>Subject <input id="newSubject" required value="Problem with my order"></label>
    <label>Message <textarea id="newMessage" rows="5" required>The left earbud crackles at any volume. Can you help?</textarea></label>
    <div class="row"><button value="cancel" class="ghost">Cancel</button><button value="ok" class="primary">Send to the AI</button></div>
  </form>
</dialog>

<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/dist/ag-grid-community.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
